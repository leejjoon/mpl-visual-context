[project]
name = "mpl-visual-context"
version = "0.1.0"  # Consider using dynamic versioning with a tool like setuptools-scm
description = "Matplotlib visual context management"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    # Add your main dependencies here
    "matplotlib>=3.0.0",
    "numpy>=1.19.0",
]

[tool.black]
skip-string-normalization = true

[tool.pytest.ini_options]
testpaths = [
    "mpl_visual_context/tests"
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

# Documentation configuration
[tool.sphinx]
# Source directory for documentation
source_dir = "docs"
# Build directory for documentation
build_dir = "docs/_build"
# Documentation format (html, dirhtml, singlehtml, etc.)
builder = "html"

# Documentation dependencies
[project.optional-dependencies]
doc = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.12.0",
    "autoapi>=2.0.0",  # Required for autoapi.sphinx
    "numpydoc>=1.2.0",
    "myst-parser>=0.18.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-gallery>=0.10.0",
    "seaborn",
    "mplcyberpunk",
]

# Documentation build configuration
[tool.doc8]
max-line-length = 100
ignore = ["D000", "D100", "D104"]
